<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Register</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<main class="page-container">
			<h1>Register</h1>
			<form id="registration-form" action="login.html" method="get">
				<label for="full-name">Full Name:</label>
				<input type="text" id="full-name" name="full-name" required>
				<label for="username">Username:</label>
				<input type="text" id="username" name="username" required>
				<label for="email">Email:</label>
				<input type="email" id="email" name="email" required>
				<label for="password">Password:</label>
				<input type="password" id="password" name="password" required>
				<label for="confirm-password">Confirm Password:</label>
				<input type="password" id="confirm-password" name="confirm-password" required>
				<button type="submit">Register</button>
				<p class="page-link">Already have an account? <a href="login.html">Login here</a></p>
			</form>
		</main>
		<script>
			document.getElementById("registration-form").addEventListener("submit", function () {
				localStorage.setItem("registeredUsername", document.getElementById("username").value);
				localStorage.setItem("registeredEmail", document.getElementById("email").value);
			});
		</script>
	</body>
</html>
